<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Subclávia • região direita</title><desc id="desc">Vista anterior com clavícula e incisura esternal; ponto de referência infraclavicular. Corte esquemático ordena clavícula, veia, escaleno anterior e artéria, com pleura próxima.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526679"/></marker></defs><rect width="720" height="400" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#26394b" font-size="17"><text x="24" y="30" font-weight="700">Subclávia • região direita</text>
<text x="30" y="63" font-size="14">Lateral → medial</text>
